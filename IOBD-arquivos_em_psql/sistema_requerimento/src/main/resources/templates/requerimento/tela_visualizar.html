<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Novo Requerimento</title>

<style>
/* Mantendo o padrão estrito de variáveis visuais */
:root {
  --primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
  --primary-color: #667eea;
  --primary-hover: #764ba2;
  --bg-body: #f1f3ff;
  
  --text-dark: #333;
  --text-muted: #666;
  --text-light: #fff;
  
  --bg-field: #f8f9ff;
  --border-field: #ccd1e9;
  --border-focus: #667eea;
  
  --shadow-card: 0 15px 35px rgba(0,0,0,0.25);
  --shadow-field-focus: 0 0 0 4px rgba(102, 126, 234, 0.15);
  
  --transition-default: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--primary-gradient);
  padding: 40px 20px;
  min-height: 100vh;
}

/* Título */
.titulo {
  text-align: center;
  color: var(--text-light);
  margin-bottom: 35px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

/* Card do Formulário */
.card-form {
  background: var(--text-light);
  max-width: 650px;
  margin: auto;
  padding: 35px;
  border-radius: 18px;
  box-shadow: var(--shadow-card);
}

/* Estrutura dos Campos */
.grupo-campo {
  margin-bottom: 22px;
  display: flex;
  flex-direction: column;
}

.label {
  font-size: 12px;
  font-weight: bold;
  color: var(--primary-color);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Inputs, Selects e Textarea padronizados */
.input-form, .select-form, .textarea-form {
  width: 100%;
  padding: 14px;
  background: var(--bg-field);
  border: 1px solid var(--border-field);
  border-radius: 10px;
  font-size: 15px;
  color: var(--text-dark);
  outline: none;
  transition: var(--transition-default);
}

.input-form:focus, .select-form:focus, .textarea-form:focus {
  border-color: var(--border-focus);
  background: var(--text-light);
  box-shadow: var(--shadow-field-focus);
}

.textarea-form {
  resize: vertical;
  min-height: 100px;
}

/* Estilização customizada para o upload de arquivo */
.input-file-container {
  position: relative;
  background: var(--bg-field);
  border: 2px dashed var(--border-field);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  transition: var(--transition-default);
  cursor: pointer;
}

.input-file-container:hover {
  border-color: var(--primary-color);
  background: #f3f5ff;
}

.input-file-hidden {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.file-message {
  font-size: 14px;
  color: var(--text-muted);
}

/* Grupo de Botões (Salvar e Cancelar) */
.acoes-form {
  display: flex;
  gap: 15px;
  margin-top: 30px;
}

.btn-salvar {
  flex: 2;
  background: var(--primary-gradient);
  color: var(--text-light);
  border: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: var(--transition-default);
  box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
}

.btn-salvar:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(118, 75, 162, 0.45);
}

.btn-cancelar {
  flex: 1;
  background: #f1f3ff;
  color: var(--primary-color);
  text-align: center;
  text-decoration: none;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  transition: var(--transition-default);
}

.btn-cancelar:hover {
  background: #e2e6ff;
}

/* Responsividade */
@media (max-width: 480px) {
  .acoes-form {
    flex-direction: column;
  }
  .card-form {
    padding: 20px;
  }
}
</style>
</head>
<body>

<h1 class="titulo">Criar Novo Requerimento</h1>

<div class="card-form">
  <form action="/adicionar_requerimento" method="POST" enctype="multipart/form-data">
    
    <div class="grupo-campo">
      <label class="label" for="matricula">Matrícula do Aluno</label>
      <input class="input-form" type="text" id="matricula" name="aluno_matricula" placeholder="Digite sua matrícula (Ex: 2026XXX)" required>
    </div>

    <div class="grupo-campo">
      <label class="label" for="tipo">Tipo de Requerimento</label>
      <select class="select-form" id="tipo" name="tipo_requerimento_id" required>
        <option value="" disabled selected>Selecione uma opção...</option>
        {{#vetTipoRequerimento}}
          <option value="{{id}}">{{descricao}}</option>
        {{/vetTipoRequerimento}}
      </select>
    </div>

    <div class="grupo-campo">
      <label class="label" for="observacao">Observação / Justificativa</label>
      <textarea class="textarea-form" id="observacao" name="observacao" placeholder="Descreva detalhadamente o seu pedido..." required></textarea>
    </div>

    <div class="grupo-campo">
      <label class="label">Documento de Comprovação (Anexo)</label>
      <div class="input-file-container">
        <span class="file-message" id="file-text">Clique aqui para selecionar um arquivo (PDF ou Imagem)</span>
        <input class="input-file-hidden" type="file" id="anexo" name="anexo" accept="image/*,application/pdf" onchange="atualizarNomeArquivo(this)" required>
      </div>
    </div>

    <div class="acoes-form">
      <a href="/requerimento" class="btn-cancelar">Cancelar</a>
      <button type="submit" class="btn-salvar">Enviar Requerimento</button>
    </div>

  </form>
</div>

<script>
// Script simples para dar feedback visual mostrando o nome do arquivo selecionado
function atualizarNomeArquivo(input) {
  const label = document.getElementById('file-text');
  if (input.files && input.files.length > 0) {
    label.innerHTML = "<strong>Arquivo selecionado:</strong> " + input.files[0].name;
    label.style.color = "#667eea";
  } else {
    label.innerText = "Clique aqui para selecionar um arquivo (PDF ou Imagem)";
    label.style.color = "#666";
  }
}
</script>

</body>
</html>
