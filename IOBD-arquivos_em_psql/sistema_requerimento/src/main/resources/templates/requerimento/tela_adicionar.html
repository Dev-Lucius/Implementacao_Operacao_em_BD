<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar Requerimento</title>

<style>
/* Variáveis para consistência de layout */
:root {
  --primary-gradient: linear-gradient(135deg, #667eea, #764ba2);
  --primary-color: #667eea;
  --text-dark: #333;
  --text-light: #fff;
  --bg-field: #f8f9ff;
  --border-field: #ccd1e9;
  --shadow-field-focus: 0 0 8px rgba(102, 126, 234, 0.4);
  --transition-default: 0.3s ease;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--primary-gradient);
  padding: 40px 20px;
  min-height: 100vh;
}

/* Título */
.titulo {
  text-align: center;
  color: var(--text-light);
  margin-bottom: 30px;
  font-weight: bold;
}

/* Card do Form */
.form-card {
  background: white;
  max-width: 550px;
  margin: auto;
  padding: 35px;
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  animation: aparecer 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Labels estruturadas */
.form-group {
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-size: 13px;
  font-weight: bold;
  color: var(--primary-color);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Padronização de Inputs, Selects e Textarea */
.select-field,
.textarea-field,
.file-field {
  width: 100%;
  padding: 12px;
  background: var(--bg-field);
  border: 1px solid var(--border-field);
  border-radius: 10px;
  font-size: 15px;
  color: var(--text-dark);
  outline: none;
  transition: var(--transition-default);
}

.select-field:focus,
.textarea-field:focus {
  border-color: var(--primary-color);
  background: white;
  box-shadow: var(--shadow-field-focus);
}

/* Ajuste específico do Textarea */
.textarea-field {
  resize: vertical;
  min-height: 110px;
  font-family: Arial, Helvetica, sans-serif;
}

/* Campo de arquivo (Upload) */
.file-field {
  background: white;
  cursor: pointer;
  padding: 10px;
}

.file-field::file-selector-button {
  background: var(--primary-gradient);
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 10px;
  transition: var(--transition-default);
}

.file-field::file-selector-button:hover {
  opacity: 0.9;
}

/* Botões de Ação */
.container-botoes {
  display: flex;
  gap: 15px;
  margin-top: 30px;
}

.botao {
  flex: 2;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--primary-gradient);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: var(--transition-default);
  box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
}

.botao:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(118, 75, 162, 0.45);
}

.btn-voltar {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  background: #f1f3ff;
  color: var(--primary-color);
  font-weight: bold;
  border-radius: 10px;
  font-size: 15px;
  transition: var(--transition-default);
}

.btn-voltar:hover {
  background: #e2e6ff;
}

/* Responsividade */
@media (max-width: 480px) {
  .container-botoes {
    flex-direction: column-reverse;
  }
  .form-card {
    padding: 20px;
  }
}
</style>

</head>
<body>

<h1 class="titulo">Adicionar Requerimento</h1>

<form class="form-card" action="/requerimento/adicionar" method="post" enctype="multipart/form-data">

  <div class="form-group">
    <label for="aluno_matricula">Matrícula do Aluno</label>
    <select class="select-field" name="aluno_matricula" id="aluno_matricula" required>
      <option value="" disabled selected>Selecione o aluno...</option>
      {{#vetAluno}}
        <option value="{{matricula}}">{{matricula}}</option>
      {{/vetAluno}}
    </select>
  </div>

  <div class="form-group">
    <label for="tipo_requerimento_id">Tipo de Requerimento</label>
    <select class="select-field" name="tipo_requerimento_id" id="tipo_requerimento_id" required>
      <option value="" disabled selected>Selecione o tipo de pedido...</option>
      {{#vetTipoRequerimento}}
        <option value="{{id}}">{{descricao}}</option>
      {{/vetTipoRequerimento}}
    </select>
  </div>

  <div class="form-group">
    <label for="observacao">Observação / Justificativa</label>
    <textarea class="textarea-field" name="observacao" id="observacao" placeholder="Descreva os detalhes do seu requerimento..." required></textarea>
  </div>

  <div class="form-group">
    <label for="anexo">Documento em Anexo</label>
    <input class="file-field" type="file" name="anexo" id="anexo" accept="image/*,application/pdf" required>
  </div>

  <div class="container-botoes">
    <a class="btn-voltar" href="/requerimento">Cancelar</a>
    <input class="botao" type="submit" value="Adicionar Requerimento">
  </div>

</form>

</body>
</html>
